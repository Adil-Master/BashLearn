<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена — BashLearn</title>

    <!-- Шрифт Tilda Sans + запасной -->
    <style>
        @import url('https://static.tildacdn.com/css/tilda-sans.css');
        body {
            font-family: 'Tilda Sans', 'Inter', sans-serif;
        }
    </style>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tilda Sans', 'Inter', sans-serif; /* Применяем шрифт ко всему */
        }

        body {
            background: #FFFFFF;
            color: #20753D;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка (как на других страницах) */
        header {
            background: #FFFFFF;
            padding: 20px 0;
            border-bottom: 3px solid #c8ffda;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #20753D;
            text-decoration: none;
        }
        .logo span {
            color: #52D47A;
        }

        nav a {
            margin-left: 30px;
            text-decoration: none;
            font-weight: 600;
            color: #20753D;
            transition: color 0.2s;
        }
        nav a:hover {
            color: #52D47A;
        }

        /* Основной блок */
        .error-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: #c8ffda;
            text-align: center;
        }

        .error-content {
            max-width: 600px;
        }

        .error-content .error-icon {
            font-size: 100px;
            color: #52D47A;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .error-content h1 {
            font-size: 80px;
            font-weight: 800;
            color: #20753D;
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-content h2 {
            font-size: 32px;
            font-weight: 700;
            color: #20753D;
            margin-bottom: 15px;
        }

        .error-content p {
            font-size: 18px;
            color: #20753D;
            opacity: 0.85;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
            font-size: 18px;
            font-family: inherit;
        }
        .btn:hover {
            transform: scale(1.03);
        }

        .btn-primary {
            background: #52D47A;
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background: #41B258;
        }

        /* Футер */
        footer {
            background: #FFFFFF;
            padding: 30px 0;
            border-top: 3px solid #c8ffda;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-links a {
            margin: 0 15px;
            color: #20753D;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-links a:hover {
            color: #52D47A;
        }

        .copyright {
            color: #20753D;
            opacity: 0.6;
            font-size: 14px;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .error-content h1 {
                font-size: 60px;
            }
            .error-content h2 {
                font-size: 26px;
            }
            .error-content .error-icon {
                font-size: 70px;
            }
            .btn {
                padding: 14px 30px;
                font-size: 16px;
            }
            nav a {
                margin-left: 15px;
            }
        }

        @media (max-width: 480px) {
            .header-inner {
                flex-direction: column;
                text-align: center;
            }
            nav a {
                margin: 0 10px;
            }
            .footer-inner {
                flex-direction: column;
                text-align: center;
            }
            .footer-links a {
                display: inline-block;
                margin: 5px 10px;
            }
            .error-content h1 {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">Bash<span>Learn</span></a>
            <nav>
                <a href="index.html">Главная</a>
                <a href="index.html#download">Скачать</a>
                <a href="about.html">О нас</a>
            </nav>
        </div>
    </header>

    <!-- Основной блок ошибки -->
    <section class="error-section">
        <div class="container">
            <div class="error-content">
                <div class="error-icon">
                    <i class="fas fa-map-signs"></i>
                </div>
                <h1>404</h1>
                <h2>Страница не найдена</h2>
                <p>
                    Возможно, вы перешли по устаревшей ссылке или допустили опечатку в адресе.
                </p>
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home"></i> На главную
                </a>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer>
        <div class="container footer-inner">
            <div class="logo" style="font-size: 20px;">Bash<span>Learn</span></div>
            <div class="footer-links">
                <a href="about.html">О нас</a>
                <a href="mailto:bashlearn@yandex.ru">Контакты</a>
                <a href="terms.html">Пользовательское соглашение и Политика конфиденциальности</a>
            </div>
            <div class="copyright">© 2026 BashLearn. Все права защищены.</div>
        </div>
    </footer>

</body>
</html>
